name: drone-cloud-sync

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: npm run tauri build -- --target ${{ matrix.target }} --no-bundle
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis,msi
      - name: Build macOS application and disk image
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Archive macOS application
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/$BUILD_TARGET/release/bundle/macos/drone-cloud-sync.app" \
            "src-tauri/target/$BUILD_TARGET/release/bundle/macos/drone-cloud-sync-$BUILD_TARGET.app.zip"
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: drone-cloud-sync-windows-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: drone-cloud-sync-macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.zip
          if-no-files-found: error
