name: drone-cloud-sync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload to (leave blank for artifacts only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_name: drone-cloud-sync-linux-x86_64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: drone-cloud-sync-windows-x86_64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            asset_name: drone-cloud-sync-macos-aarch64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            asset_name: drone-cloud-sync-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libfuse2 xdg-utils
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Build Linux AppImage and DEB
        if: runner.os == 'Linux'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles appimage,deb
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis,msi
      - name: Build macOS application and disk image
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Archive macOS application
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/$BUILD_TARGET/release/bundle/macos/drone-cloud-sync.app" \
            "src-tauri/target/$BUILD_TARGET/release/bundle/macos/drone-cloud-sync-$BUILD_TARGET.app.zip"
      - name: Prepare release assets
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          mkdir -p release-assets
          BUILD_DIR="src-tauri/target/$BUILD_TARGET/release/bundle"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cp "$BUILD_DIR"/appimage/*.AppImage "release-assets/$ASSET_NAME.AppImage"
            cp "$BUILD_DIR"/deb/*.deb "release-assets/$ASSET_NAME.deb"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$BUILD_DIR"/nsis/*.exe "release-assets/$ASSET_NAME-setup.exe"
            cp "$BUILD_DIR"/msi/*.msi "release-assets/$ASSET_NAME.msi"
          else
            cp "$BUILD_DIR"/dmg/*.dmg "release-assets/$ASSET_NAME.dmg"
            cp "$BUILD_DIR"/macos/*.app.zip "release-assets/$ASSET_NAME.app.zip"
          fi
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: drone-cloud-sync-linux-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: drone-cloud-sync-windows-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: drone-cloud-sync-macos-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Upload release assets
    needs: build
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: drone-cloud-sync-*
          path: release-assets
          merge-multiple: true
      - name: Attach installers to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
