[package]
name = "drone-cloud-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "A private desktop application for managing cloud flight logs"
license = "AGPL-3.0-only"

[lib]
name = "drone_cloud_sync"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "drone-cloud-sync"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:open", "native-vault"]
native-vault = ["dep:keyring"]

[build-dependencies]
tauri-build = { version = "2.5", optional = true, features = [] }

[dependencies]
tauri = { package = "tauri", version = "2.10", optional = true, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
zeroize = "1.8"
flate2 = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
rfd = { version = "0.16", optional = true }
open = { version = "5", optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
